name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. v1.0.0 (test build; not attached to a release)'
        required: true
        default: 'v0.0.0-test'

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------- Windows ---
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          raw="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && raw="${{ github.event.inputs.version }}"
          echo "v=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Stage payload (tracked source only)
        shell: bash
        run: |
          mkdir -p payload
          git archive --format=tar HEAD | tar -x -C payload

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.v }}" `
            packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  # ----------------------------------------------------------------- macOS ---
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          raw="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && raw="${{ github.event.inputs.version }}"
          echo "v=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build .dmg
        run: bash packaging/macos/build_dmg.sh "${{ steps.ver.outputs.v }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  # ---------------------------------------------------------------- Release ---
  # Publishing is a separate job on purpose. When both build jobs attached the
  # release themselves they raced to create the same one: whichever lost gave up
  # with "Too many retries", and a half-populated release still went public
  # (v1.1.2 shipped with only the .exe). Building and publishing are now
  # separate, so a failed build blocks the release instead of truncating it.
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # for packaging/RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify both installers are present
        run: |
          ls -la dist
          test -n "$(find dist -name '*.exe' -print -quit)" || { echo '::error::missing .exe'; exit 1; }
          test -n "$(find dist -name '*.dmg' -print -quit)" || { echo '::error::missing .dmg'; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: packaging/RELEASE_NOTES.md
